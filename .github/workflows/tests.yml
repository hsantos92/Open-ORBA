name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python and Tk
        run: sudo apt-get update && sudo apt-get install -y python3 python3-tk
      - name: Run unit tests
        run: python3 -m unittest -v
